<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイページ — FAIRWAY</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Zen+Kaku+Gothic+New:wght@300;400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="common.js"></script>
<style>
  .page-hero{background:linear-gradient(135deg,#222222,#1b5e20);padding:3rem 4rem 2rem;border-bottom:1px solid rgba(201,168,76,.15)}
  .page-hero h1{font-family:var(--font-hd);font-size:3rem;letter-spacing:.1em;color:var(--cream)}
  .page-hero h1 span{color:var(--gold)}
  .mypage-layout{display:grid;grid-template-columns:220px 1fr;gap:2px;min-height:calc(100vh - 200px)}
  @media(max-width:800px){.mypage-layout{grid-template-columns:1fr}}
  .mp-sidebar{background:#222222;padding:1.5rem 0;border-right:1px solid rgba(46,125,50,.2)}
  @media(max-width:800px){.mp-sidebar{display:flex;overflow-x:auto;padding:.5rem;border-right:none;border-bottom:1px solid rgba(201,168,76,.1)}}
  .mp-nav-btn{width:100%;padding:1rem 1.5rem;background:none;border:none;color:rgba(245,240,232,.5);font-family:var(--font-ja);font-size:.8rem;letter-spacing:.1em;cursor:pointer;text-align:left;display:flex;align-items:center;gap:.7rem;transition:all .2s;border-left:3px solid transparent}
  .mp-nav-btn:hover{color:var(--cream);background:rgba(201,168,76,.05)}
  .mp-nav-btn.active{color:var(--gold);background:rgba(201,168,76,.06);border-left-color:var(--gold)}
  @media(max-width:800px){.mp-nav-btn{width:auto;white-space:nowrap;border-left:none;border-bottom:3px solid transparent;padding:.7rem 1rem}.mp-nav-btn.active{border-left:none;border-bottom-color:var(--gold)}}
  .mp-nav-icon{font-size:1.1rem}
  .mp-content{background:#2a2a2a;padding:2.5rem 3rem}
  @media(max-width:800px){.mp-content{padding:1.5rem}}
  .lang-toggle{display:flex;align-items:center;gap:0;border:1px solid rgba(201,168,76,.35);overflow:hidden;flex-shrink:0}
  .lang-btn{padding:.4rem .7rem;background:none;border:none;color:rgba(245,240,232,.45);font-family:var(--font-ja);font-size:.7rem;letter-spacing:.08em;cursor:pointer;transition:all .2s;line-height:1}
  .lang-btn.active{background:var(--gold);color:var(--black);font-weight:700}
  .lang-btn:not(.active):hover{color:var(--gold);background:rgba(201,168,76,.08)}
  .lang-divider{width:1px;height:16px;background:rgba(201,168,76,.3);flex-shrink:0}
  .auth-wrap{max-width:380px}
  .auth-title{font-family:var(--font-en);font-size:2rem;font-weight:300;color:var(--cream);margin-bottom:.4rem}
  .auth-sub{font-size:.78rem;color:var(--gray);margin-bottom:1.8rem;line-height:1.7}
  .auth-form{display:flex;flex-direction:column;gap:.9rem}
  .auth-input{background:rgba(255,255,255,.09);border:1px solid rgba(245,240,232,.12);color:var(--cream);padding:.85rem 1rem;font-family:var(--font-ja);font-size:.85rem;outline:none;transition:border-color .2s;width:100%}
  .auth-input:focus{border-color:rgba(201,168,76,.5)}
  .auth-input::placeholder{color:rgba(245,240,232,.2)}
  .auth-btn{padding:.9rem;background:var(--gold);color:var(--black);font-family:var(--font-ja);font-size:.85rem;font-weight:700;letter-spacing:.12em;border:none;cursor:pointer;transition:all .2s;width:100%}
  .auth-btn:hover{background:var(--gold-lt)}
  .auth-btn:disabled{opacity:.5;cursor:not-allowed}
  .auth-switch{text-align:center;margin-top:1rem;font-size:.78rem;color:var(--gray)}
  .auth-switch button{background:none;border:none;color:var(--gold);cursor:pointer;font-size:.78rem;font-family:var(--font-ja);text-decoration:underline}
  .auth-error{background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.4);color:#e07060;padding:.7rem 1rem;font-size:.78rem;margin-bottom:.8rem;display:none}
  .auth-error.show{display:block}
  .user-card{background:linear-gradient(135deg,var(--forest),rgba(46,125,50,.4));padding:1.5rem;border:1px solid rgba(201,168,76,.15);margin-bottom:1.5rem;display:flex;align-items:center;gap:1.2rem}
  .user-avatar{width:56px;height:56px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--font-hd);font-size:1.6rem;color:var(--black);flex-shrink:0}
  .user-name{font-family:var(--font-en);font-size:1.2rem;color:var(--cream);margin-bottom:.2rem}
  .user-email{font-size:.75rem;color:var(--gray)}
  .user-since{font-size:.68rem;color:rgba(201,168,76,.6);margin-top:.2rem}
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(201,168,76,.1);margin-bottom:2rem}
  .stat-box{background:#222222;padding:1.2rem;text-align:center}
  .stat-num{font-family:var(--font-hd);font-size:2rem;color:var(--gold-lt);line-height:1}
  .stat-lbl{font-size:.65rem;letter-spacing:.1em;color:var(--gray);margin-top:.3rem}
  .sec-title{font-family:var(--font-en);font-size:1.1rem;color:var(--cream);margin-bottom:1rem;padding-bottom:.6rem;border-bottom:1px solid rgba(201,168,76,.1)}
  .pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:1.2rem;max-width:540px}
  @media(max-width:640px){.pf-grid{grid-template-columns:1fr}}
  .pf-group{display:flex;flex-direction:column;gap:.35rem}
  .pf-group.full{grid-column:1/-1}
  .pf-label{font-size:.68rem;letter-spacing:.12em;color:rgba(245,240,232,.45)}
  .pf-input{background:rgba(255,255,255,.09);border:1px solid rgba(245,240,232,.1);color:var(--cream);padding:.65rem .85rem;font-family:var(--font-ja);font-size:.82rem;outline:none;transition:border-color .2s;width:100%}
  .pf-input:focus{border-color:rgba(201,168,76,.45)}
  .save-btn{padding:.8rem 2rem;background:var(--gold);color:var(--black);font-family:var(--font-ja);font-size:.82rem;font-weight:700;letter-spacing:.1em;border:none;cursor:pointer;transition:all .2s}
  .save-btn:hover{background:var(--gold-lt)}
  .logout-btn{margin-top:1rem;padding:.7rem 2rem;background:transparent;color:rgba(245,240,232,.35);font-family:var(--font-ja);font-size:.78rem;letter-spacing:.1em;border:1px solid rgba(245,240,232,.1);cursor:pointer;transition:all .2s}
  .logout-btn:hover{border-color:var(--red);color:var(--red)}
  .order-card{border:1px solid rgba(201,168,76,.12);margin-bottom:1rem;overflow:hidden}
  .order-hdr{padding:.9rem 1.1rem;background:rgba(46,125,50,.18);display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:1rem}
  .order-hdr:hover{background:rgba(46,125,50,.2)}
  .order-num{font-family:var(--font-hd);font-size:.95rem;letter-spacing:.15em;color:var(--gold)}
  .order-date{font-size:.7rem;color:var(--gray);margin-top:.1rem}
  .order-total{font-family:var(--font-en);font-size:1.1rem;color:var(--cream)}
  .order-status{font-size:.65rem;letter-spacing:.1em;padding:.2rem .6rem;margin-top:.2rem;display:inline-block}
  .status-delivered{background:rgba(46,125,50,.4);border:1px solid rgba(46,125,50,.6);color:#7ec8a0}
  .status-shipped{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);color:var(--gold-lt)}
  .status-processing{background:rgba(50,80,150,.15);border:1px solid rgba(80,120,200,.3);color:#89aaee}
  .order-items-wrap{padding:1rem 1.1rem;border-top:1px solid rgba(201,168,76,.08);display:none}
  .order-items-wrap.open{display:block}
  .order-item{display:flex;align-items:center;gap:.7rem;padding:.4rem 0;border-bottom:1px solid rgba(245,240,232,.04)}
  .order-item:last-child{border-bottom:none}
  .oi-icon{font-size:1.3rem;width:32px;text-align:center}
  .oi-info{flex:1}
  .oi-name{font-size:.8rem;color:var(--cream)}
  .oi-brand{font-size:.67rem;color:var(--gray)}
  .oi-price{font-family:var(--font-en);font-size:.88rem;color:var(--gold-lt)}
  .chevron{color:var(--gray);transition:transform .2s;flex-shrink:0}
  .order-hdr.open .chevron{transform:rotate(180deg)}
  .wish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
  .wish-card{background:#2e7d32;padding:1.2rem;position:relative;transition:transform .2s}
  .wish-card:hover{transform:translateY(-3px)}
  .wish-icon{font-size:3rem;text-align:center;margin-bottom:.7rem;display:block}
  .wish-brand{font-size:.6rem;letter-spacing:.2em;color:var(--gold);margin-bottom:.2rem}
  .wish-name{font-size:.88rem;color:var(--cream);margin-bottom:.3rem;font-family:var(--font-en)}
  .wish-price{font-family:var(--font-en);font-size:1.05rem;color:var(--cream);margin-bottom:.8rem}
  .wish-actions{display:flex;gap:.5rem}
  .wish-add-btn{flex:1;padding:.5rem;background:var(--gold);color:var(--black);font-size:.72rem;font-weight:700;border:none;cursor:pointer;font-family:var(--font-ja);transition:background .2s}
  .wish-add-btn:hover{background:var(--gold-lt)}
  .wish-del-btn{padding:.5rem .7rem;background:transparent;border:1px solid rgba(245,240,232,.12);color:rgba(245,240,232,.4);font-size:.8rem;cursor:pointer;transition:all .2s}
  .wish-del-btn:hover{border-color:var(--red);color:var(--red)}
  .review-card{border:1px solid rgba(201,168,76,.1);padding:1rem;margin-bottom:.8rem;background:rgba(255,255,255,.1)}
  .review-card-head{display:flex;align-items:center;gap:.8rem;margin-bottom:.6rem}
  .review-product-icon{font-size:1.8rem;width:44px;text-align:center}
  .review-product-name{font-size:.85rem;color:var(--cream)}
  .review-date{font-size:.68rem;color:var(--gray);margin-top:.15rem}
  .review-stars{color:var(--gold);font-size:.85rem;margin-bottom:.3rem}
  .review-title{font-size:.85rem;color:var(--cream);font-weight:700;margin-bottom:.2rem}
  .review-body{font-size:.78rem;color:rgba(245,240,232,.6);line-height:1.7}
  .review-del-btn{background:none;border:none;color:rgba(245,240,232,.2);font-size:.75rem;cursor:pointer;margin-top:.5rem;transition:color .2s}
  .review-del-btn:hover{color:var(--red)}
  .review-form{background:rgba(255,255,255,.1);border:1px solid rgba(201,168,76,.1);padding:1.2rem;margin-bottom:1.5rem}
  .review-form-title{font-size:.85rem;color:var(--cream);margin-bottom:1rem}
  .star-select{display:flex;gap:.3rem;margin-bottom:.8rem;font-size:1.6rem;cursor:pointer}
  .star-select span{color:rgba(245,240,232,.2);transition:color .1s}
  .star-select span.on{color:var(--gold)}
  .review-input{background:rgba(255,255,255,.09);border:1px solid rgba(245,240,232,.12);color:var(--cream);padding:.7rem .9rem;font-family:var(--font-ja);font-size:.82rem;outline:none;transition:border-color .2s;width:100%;margin-bottom:.6rem}
  .review-input:focus{border-color:rgba(201,168,76,.45)}
  .review-textarea{background:rgba(255,255,255,.09);border:1px solid rgba(245,240,232,.12);color:var(--cream);padding:.7rem .9rem;font-family:var(--font-ja);font-size:.82rem;outline:none;transition:border-color .2s;width:100%;resize:vertical;min-height:80px;margin-bottom:.8rem}
  .review-textarea:focus{border-color:rgba(201,168,76,.45)}
  .product-select{background:rgba(255,255,255,.09);border:1px solid rgba(245,240,232,.12);color:var(--cream);padding:.7rem .9rem;font-family:var(--font-ja);font-size:.82rem;outline:none;width:100%;margin-bottom:.8rem;-webkit-appearance:none}
  .product-select option{background:#444444}
  .addr-card{border:1px solid rgba(201,168,76,.12);padding:1rem 1.2rem;margin-bottom:.7rem;position:relative;transition:border-color .25s}
  .addr-card:hover{border-color:rgba(201,168,76,.28)}
  .addr-card.default{border-color:rgba(201,168,76,.45);background:rgba(201,168,76,.04)}
  .addr-label{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
  .addr-label-text{font-family:var(--font-hd);font-size:.95rem;letter-spacing:.1em;color:var(--cream)}
  .default-badge{font-size:.62rem;padding:.1rem .5rem;background:var(--gold);color:var(--black);font-weight:700}
  .addr-body{font-size:.8rem;color:rgba(245,240,232,.7);line-height:1.8}
  .addr-actions{display:flex;gap:.5rem;margin-top:.7rem}
  .addr-btn{padding:.4rem .8rem;background:transparent;border:1px solid rgba(245,240,232,.12);color:rgba(245,240,232,.5);font-size:.72rem;cursor:pointer;font-family:var(--font-ja);transition:all .2s}
  .addr-btn:hover{border-color:var(--gold);color:var(--gold)}
  .addr-btn.del:hover{border-color:var(--red);color:var(--red)}
  .addr-form{background:rgba(255,255,255,.1);border:1px solid rgba(201,168,76,.1);padding:1.2rem;margin-bottom:1.5rem}
  .addr-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:.8rem}
  @media(max-width:640px){.addr-form-grid{grid-template-columns:1fr}}
  .addr-input{background:rgba(255,255,255,.09);border:1px solid rgba(245,240,232,.12);color:var(--cream);padding:.65rem .85rem;font-family:var(--font-ja);font-size:.82rem;outline:none;transition:border-color .2s;width:100%}
  .addr-input:focus{border-color:rgba(201,168,76,.45)}
  .addr-input::placeholder{color:rgba(245,240,232,.2)}
  .addr-check-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.8rem;font-size:.78rem;color:rgba(245,240,232,.6);cursor:pointer}
  .ai-sub{font-size:.78rem;color:var(--gray);line-height:1.8;margin-bottom:1.2rem}
  .ai-msgs{min-height:120px;max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:.6rem;margin-bottom:.8rem}
  .ai-msg{padding:.7rem .9rem;font-size:.78rem;line-height:1.7;max-width:88%}
  .ai-msg.user{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);color:var(--cream);align-self:flex-end}
  .ai-msg.assistant{background:rgba(255,255,255,.1);border:1px solid rgba(46,125,50,.3);color:rgba(245,240,232,.85);align-self:flex-start}
  .ai-msg.loading{opacity:.5;font-style:italic}
  .ai-input-row{display:flex;gap:.5rem}
  .ai-input{flex:1;background:rgba(255,255,255,.09);border:1px solid rgba(245,240,232,.1);color:var(--cream);padding:.65rem .85rem;font-family:var(--font-ja);font-size:.8rem;outline:none;transition:border-color .2s}
  .ai-input:focus{border-color:rgba(201,168,76,.4)}
  .ai-input::placeholder{color:rgba(245,240,232,.2)}
  .ai-send{padding:.65rem 1.1rem;background:var(--gold);color:var(--black);font-family:var(--font-ja);font-size:.78rem;font-weight:700;border:none;cursor:pointer;white-space:nowrap;transition:background .2s}
  .ai-send:hover{background:var(--gold-lt)}
  .ai-send:disabled{opacity:.4;cursor:not-allowed}
  .ai-chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.7rem}
  .ai-chip{padding:.35rem .7rem;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);color:var(--gold-lt);font-size:.7rem;cursor:pointer;font-family:var(--font-ja);transition:background .2s}
  .ai-chip:hover{background:rgba(201,168,76,.18)}
  .empty{text-align:center;padding:3rem 1rem;color:var(--gray)}
  .empty-icon{font-size:3rem;opacity:.3;margin-bottom:.8rem}
  .empty p{font-size:.83rem}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">FAIR<span>WAY</span></a>
  <ul class="nav-links">
    <li><a href="index.html" data-i18n="nav.shop">ショップ</a></li>
    <li><a href="cart.html" data-i18n="nav.cart">カート</a></li>

  <div class="nav-right">
    <!-- Language Toggle -->
    <div class="lang-toggle">
      <button class="lang-btn active" id="langJP" onclick="setLang('ja')">JP</button>

      <div class="lang-divider"></div>
      <button class="lang-btn" id="langZH" onclick="setLang('zh')">中文</button>
    </div>
    <a href="mypage.html" class="nav-btn active" id="mypageNavBtn">
      <span class="user-dot" id="userDot"></span><span data-i18n="nav.mypage">マイページ</span>

</nav>

<div class="page-wrap">
  <div class="page-hero">
    <h1>MY PAGE <span data-i18n="hero.sub">マイページ</span></h1>
  </div>
  <div class="mypage-layout">
    <div class="mp-sidebar" id="mpSidebar">
      <button class="mp-nav-btn active" id="nav-auth" onclick="switchTab('auth')"><span class="mp-nav-icon">🔑</span><span data-i18n="tab.login">ログイン</span></button>
      <button class="mp-nav-btn" id="nav-profile" onclick="switchTab('profile')" style="display:none"><span class="mp-nav-icon">👤</span><span data-i18n="tab.profile">プロフィール</span></button>
      <button class="mp-nav-btn" id="nav-history" onclick="switchTab('history')" style="display:none"><span class="mp-nav-icon">📦</span><span data-i18n="tab.history">購入履歴</span></button>
      <button class="mp-nav-btn" id="nav-wishlist" onclick="switchTab('wishlist')" style="display:none"><span class="mp-nav-icon">❤️</span><span data-i18n="tab.wishlist">お気に入り</span></button>
      <button class="mp-nav-btn" id="nav-reviews" onclick="switchTab('reviews')" style="display:none"><span class="mp-nav-icon">⭐</span><span data-i18n="tab.reviews">レビュー</span></button>
      <button class="mp-nav-btn" id="nav-addresses" onclick="switchTab('addresses')" style="display:none"><span class="mp-nav-icon">🏠</span><span data-i18n="tab.addresses">住所管理</span></button>
      <button class="mp-nav-btn" id="nav-ai" onclick="switchTab('ai')" style="display:none"><span class="mp-nav-icon">🤖</span><span data-i18n="tab.ai">AIアドバイザー</span></button>
    </div>
    <div class="mp-content" id="mpContent"></div>
  </div>
</div>

let currentLang = localStorage.getItem('fw_lang') || 'ja';

function t(key, ...args) {
  let val = I18N[currentLang]?.[key] ?? I18N['ja'][key] ?? key;
  args.forEach(a => { val = val.replace('%s', a); });
  return val;
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('fw_lang', lang);
  document.documentElement.lang = lang;
  document.getElementById('langJP').classList.toggle('active', lang === 'ja');
  document.getElementById('langEN').classList.toggle('active', lang === 'en');
  document.getElementById('langZH').classList.toggle('active', lang === 'zh');
  // Translate static data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = I18N[lang][key];
    if (val !== undefined) el.innerHTML = val;
  });
  // Update logout/login label in sidebar
  if (currentUser) {
    const authBtn = document.getElementById('nav-auth');
    if (authBtn) authBtn.innerHTML = `<span class="mp-nav-icon">🚪</span>${t('tab.logout')}`;
  }
  // Re-render current tab
  const activeTab = document.querySelector('.mp-nav-btn.active');
  if (activeTab) {
    const tabId = activeTab.id.replace('nav-', '');
    if (tabId !== 'auth') {
      const body = document.getElementById('mpContent');
      if (tabId === 'profile') renderProfile(body);
      else if (tabId === 'history') renderHistory(body);
      else if (tabId === 'wishlist') renderWishlist(body);
      else if (tabId === 'reviews') renderReviews(body);
      else if (tabId === 'addresses') renderAddresses(body);
      else if (tabId === 'ai') renderAI(body);
    } else {
      renderAuth(document.getElementById('mpContent'));
    }
  }
  const titles = {ja:'マイページ — FAIRWAY', en:'My Page — FAIRWAY', zh:'我的页面 — FAIRWAY'};
  document.title = titles[lang] || titles.ja;
}

let orderHistory = [];
let wishlistData = [];
let myReviews = [];
let addresses = [];
let aiMessages = [];
let authMode = 'login';
let reviewRating = 0;

// ── TABS ──
const TABS = ['auth','profile','history','wishlist','reviews','addresses','ai'];
function switchTab(tab) {
  TABS.forEach(t2 => {
    const btn = document.getElementById('nav-'+t2);
    if (btn) btn.classList.toggle('active', t2===tab);
  });
  const body = document.getElementById('mpContent');
  if (tab==='auth' && currentUser) { doLogout(); return; }
  if (tab==='auth') renderAuth(body);
  else if (tab==='profile') renderProfile(body);
  else if (tab==='history') renderHistory(body);
  else if (tab==='wishlist') renderWishlist(body);
  else if (tab==='reviews') renderReviews(body);
  else if (tab==='addresses') renderAddresses(body);
  else if (tab==='ai') renderAI(body);
}

function showLoggedInTabs() {
  ['profile','history','wishlist','reviews','addresses','ai'].forEach(t2 => {
    const btn = document.getElementById('nav-'+t2);
    if (btn) btn.style.display = '';
  });
  const authBtn = document.getElementById('nav-auth');
  authBtn.innerHTML = `<span class="mp-nav-icon">🚪</span>${t('tab.logout')}`;
  const dot = document.getElementById('userDot');
  if (dot) dot.style.background = 'var(--gold)';
  document.getElementById('mypageNavBtn').classList.add('logged-in');
}

function doLogout() {
  token = null; currentUser = null; orderHistory = []; wishlistData = []; myReviews = []; addresses = []; aiMessages = [];
  localStorage.removeItem('fw_token');
  updateCartBadge();
  ['profile','history','wishlist','reviews','addresses','ai'].forEach(t2 => {
    const btn = document.getElementById('nav-'+t2);
    if (btn) { btn.style.display='none'; btn.classList.remove('active'); }
  });
  document.getElementById('nav-auth').innerHTML = `<span class="mp-nav-icon">🔑</span>${t('tab.login')}`;
  document.getElementById('nav-auth').classList.add('active');
  const dot = document.getElementById('userDot');
  if (dot) dot.style.background = 'var(--gray)';
  document.getElementById('mypageNavBtn').classList.remove('logged-in');
  authMode = 'login';
  renderAuth(document.getElementById('mpContent'));
  showToast(t('toast.loggedOut'));
}

// ── AUTH ──
function renderAuth(body) {
  const isLogin = authMode === 'login';
  body.innerHTML = `
    <div class="auth-wrap">
      <h2 class="auth-title">${t(isLogin ? 'auth.loginTitle' : 'auth.regTitle')}</h2>
      <p class="auth-sub">${t(isLogin ? 'auth.loginSub' : 'auth.regSub')}</p>
      <div class="auth-error" id="authError"></div>
      <div class="auth-form">
        ${!isLogin ? `<input class="auth-input" id="authName" type="text" placeholder="${t('auth.name')}">` : ''}
        <input class="auth-input" id="authEmail" type="email" placeholder="${t('auth.email')}">
        <input class="auth-input" id="authPass" type="password" placeholder="${t('auth.pass')}">
        ${!isLogin ? `<input class="auth-input" id="authPass2" type="password" placeholder="${t('auth.pass2')}">` : ''}
        <button class="auth-btn" id="authBtn" onclick="submitAuth()">${t(isLogin ? 'auth.loginBtn' : 'auth.regBtn')}</button>
      </div>
      <p class="auth-switch">${t(isLogin ? 'auth.toReg' : 'auth.toLogin')}<button onclick="toggleAuth()">${t(isLogin ? 'auth.regLink' : 'auth.loginLink')}</button></p>
    </div>`;
  document.getElementById('authEmail')?.addEventListener('keydown', e => { if(e.key==='Enter') submitAuth(); });
}

function toggleAuth() { authMode = authMode==='login' ? 'register' : 'login'; renderAuth(document.getElementById('mpContent')); }

async function submitAuth() {
  const btn = document.getElementById('authBtn');
  const err = document.getElementById('authError');
  const email = document.getElementById('authEmail')?.value.trim();
  const pass = document.getElementById('authPass')?.value;
  err.classList.remove('show');
  if (!email || !pass) { err.textContent = t('auth.err.empty'); err.classList.add('show'); return; }
  if (pass.length < 6) { err.textContent = t('auth.err.short'); err.classList.add('show'); return; }
  btn.disabled = true; btn.textContent = t('auth.processing');
  try {
    let data;
    if (authMode === 'login') {
      data = await api('POST', '/api/auth/login', {email, password: pass});
    } else {
      const name = document.getElementById('authName')?.value.trim() || '';
      const pass2 = document.getElementById('authPass2')?.value;
      if (!name) { err.textContent = t('auth.err.name'); err.classList.add('show'); btn.disabled=false; btn.textContent=t('auth.regBtn'); return; }
      if (pass !== pass2) { err.textContent = t('auth.err.pass'); err.classList.add('show'); btn.disabled=false; btn.textContent=t('auth.regBtn'); return; }
      data = await api('POST', '/api/auth/register', {email, password: pass, name});
    }
    token = data.token; currentUser = data.user;
    localStorage.setItem('fw_token', token);
    await loadAllData();
    showLoggedInTabs();
    showToast(t('toast.welcome', currentUser.name));
    switchTab('profile');
  } catch(e) {
    err.textContent = e.message; err.classList.add('show');
    btn.disabled = false; btn.textContent = t(authMode==='login' ? 'auth.loginBtn' : 'auth.regBtn');
  }
}

async function loadAllData() {
  try { const r = await api('GET', '/api/orders'); orderHistory = r; } catch{}
  try { const r = await api('GET', '/api/wishlist'); wishlistData = r.map(x => x.product_id); } catch{}
  try { const r = await api('GET', '/api/reviews'); myReviews = r; } catch{}
  try { const r = await api('GET', '/api/addresses'); addresses = r; } catch{}
}

// ── PROFILE ──

  const localeMap = {ja:'ja-JP', en:'en-US', zh:'zh-CN'};
  const since = currentUser.created_at ? new Date(currentUser.created_at).toLocaleDateString(localeMap[currentLang]||'ja-JP', {year:'numeric',month:'long'}) : '—';
  body.innerHTML = `
    <div class="user-card">
      <div class="user-avatar">${initials}</div>
      <div><div class="user-name">${currentUser.name||'—'}</div><div class="user-email">${currentUser.email}</div><div class="user-since">${t('pf.since')}${since}</div></div>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-num">${orderHistory.length}</div><div class="stat-lbl">${t('pf.orders')}</div></div>
      <div class="stat-box"><div class="stat-num">¥${Math.round(totalSpent/1000)}K</div><div class="stat-lbl">${t('pf.spent')}</div></div>
      <div class="stat-box"><div class="stat-num">${totalItems}</div><div class="stat-lbl">${t('pf.items')}</div></div>
    </div>
    <div class="sec-title">${t('pf.editTitle')}</div>
    <div class="pf-grid">
      <div class="pf-group"><div class="pf-label">${t('pf.name')}</div><input class="pf-input" id="pf_name" value="${currentUser.name||''}"></div>
      <div class="pf-group"><div class="pf-label">${t('pf.kana')}</div><input class="pf-input" id="pf_kana" value="${currentUser.kana||''}"></div>
      <div class="pf-group"><div class="pf-label">${t('pf.phone')}</div><input class="pf-input" id="pf_phone" value="${currentUser.phone||''}" placeholder="090-0000-0000"></div>
      <div class="pf-group"><div class="pf-label">${t('pf.zip')}</div><input class="pf-input" id="pf_zip" value="${currentUser.zip||''}" placeholder="123-4567"></div>
      <div class="pf-group"><div class="pf-label">${t('pf.pref')}</div><input class="pf-input" id="pf_pref" value="${currentUser.pref||''}"></div>
      <div class="pf-group"><div class="pf-label">${t('pf.city')}</div><input class="pf-input" id="pf_city" value="${currentUser.city||''}"></div>
      <div class="pf-group full"><div class="pf-label">${t('pf.addr')}</div><input class="pf-input" id="pf_addr" value="${currentUser.addr||''}"></div>
    </div>
    <button class="save-btn" onclick="saveProfile()">${t('pf.save')}</button>
    <br><button class="logout-btn" onclick="switchTab('auth')">${t('pf.logout')}</button>`;
}

async function saveProfile() {
  try {
    currentUser = await api('PATCH', '/api/profile', {
      name: document.getElementById('pf_name').value,
      kana: document.getElementById('pf_kana').value,
      phone: document.getElementById('pf_phone').value,
      zip: document.getElementById('pf_zip').value,
      pref: document.getElementById('pf_pref').value,
      city: document.getElementById('pf_city').value,
      addr: document.getElementById('pf_addr').value
    });
    showToast(t('pf.saved'));
    renderProfile(document.getElementById('mpContent'));
  } catch(e) { showToast(t('pf.saveFail') + e.message); }
}

// ── HISTORY ──
function renderHistory(body) {
  if (!currentUser) { switchTab('auth'); return; }
  if (!orderHistory.length) {
    body.innerHTML = `<div class="empty"><div class="empty-icon">📦</div><p>${t('hist.empty')}</p></div>`;
    return;
  }
  const stMap = {
    delivered: {label: t('hist.delivered'), cls:'status-delivered'},
    shipped:   {label: t('hist.shipped'),   cls:'status-shipped'},
    processing:{label: t('hist.processing'),cls:'status-processing'}
  };
  body.innerHTML = orderHistory.map((o,i) => {
    const st = stMap[o.status] || stMap.processing;
    const locMap = {ja:'ja-JP', en:'en-US', zh:'zh-CN'};
    const dt = new Date(o.created_at).toLocaleDateString(locMap[currentLang]||'ja-JP', {year:'numeric',month:'long',day:'numeric'});
    const items = Array.isArray(o.items) ? o.items : JSON.parse(o.items||'[]');
    return `<div class="order-card">
      <div class="order-hdr" id="ohdr${i}" onclick="toggleOrder(${i})">
        <div><div class="order-num">${o.order_number}</div><div class="order-date">${dt}</div></div>
        <div style="text-align:right"><div class="order-total">¥${(o.total||0).toLocaleString()}</div><div class="order-status ${st.cls}">${st.label}</div></div>
        <span class="chevron">▼</span>
      </div>
      <div class="order-items-wrap" id="owrap${i}">
        ${items.map(it => `<div class="order-item"><div class="oi-icon">${it.icon||'📦'}</div><div class="oi-info"><div class="oi-name">${it.name}</div><div class="oi-brand">${it.brand} · ${it.qty}${currentLang==='en'?' pcs':currentLang==='zh'?'件':'点'}</div></div><div class="oi-price">¥${((it.price||0)*it.qty).toLocaleString()}</div></div>`).join('')}
        <div style="padding-top:.7rem;font-size:.72rem;color:var(--gray)">${t('hist.ship_to')}${o.shipping_address||'—'}</div>
      </div>
    </div>`;
  }).join('');
}
function toggleOrder(i) {
  const w = document.getElementById('owrap'+i), h = document.getElementById('ohdr'+i);
  const o = w.classList.toggle('open'); h.classList.toggle('open', o);
}

// ── WISHLIST ──
function renderWishlist(body) {
  if (!currentUser) { switchTab('auth'); return; }
  if (!wishlistData.length) {
    body.innerHTML = `<div class="empty"><div class="empty-icon">❤️</div><p>${t('wish.empty1')}</p><p style="margin-top:.4rem;font-size:.72rem">${t('wish.empty2')}</p></div>`;
    return;
  }
  const items = wishlistData.map(id => PRODUCTS.find(p => p.id===id)).filter(Boolean);

    <div class="wish-card">
      <span class="wish-icon">${p.icon}</span>
      <div class="wish-brand">${p.brand}</div>
      <div class="wish-name">${p.name}</div>
      <div class="wish-price">¥${p.price.toLocaleString()}<small style="font-size:.65rem;color:var(--gray);font-family:var(--font-ja)">${currentLang==='en'?' (tax incl.)':currentLang==='zh'?'（含税）':'（税込）'}</small></div>
      <div class="wish-actions">
        <button class="wish-add-btn" onclick="addToCart(${p.id});showToast('${t('wish.added')}')">${t('wish.cartBtn')}</button>
        <button class="wish-del-btn" onclick="removeWish(${p.id})">✕</button>

}
async function removeWish(id) {
  try {
    await api('DELETE', `/api/wishlist/${id}`);
    wishlistData = wishlistData.filter(x => x!==id);
    renderWishlist(document.getElementById('mpContent'));
    showToast(t('wish.removed'));
  } catch{}
}

// ── REVIEWS ──
function renderReviews(body) {
  if (!currentUser) { switchTab('auth'); return; }
  body.innerHTML = `
    <div class="review-form">
      <div class="review-form-title">${t('rv.formTitle')}</div>
      <select class="product-select" id="rv_product">
        <option value="">${t('rv.select')}</option>
        ${PRODUCTS.map(p => `<option value="${p.id}">${p.name}（${p.brand}）</option>`).join('')}
      </select>
      <div style="margin-bottom:.6rem;font-size:.72rem;color:rgba(245,240,232,.5)">${t('rv.ratingLbl')}</div>
      <div class="star-select" id="starSelect">
        ${[1,2,3,4,5].map(n => `<span onclick="setRating(${n})" id="star${n}">★</span>`).join('')}
      </div>
      <input class="review-input" id="rv_title" placeholder="${t('rv.titlePh')}">
      <textarea class="review-textarea" id="rv_body" placeholder="${t('rv.bodyPh')}"></textarea>
      <button class="save-btn" onclick="submitReview()">${t('rv.submit')}</button>
    </div>
    <div class="sec-title">${t('rv.myTitle')}</div>
    ${myReviews.length ? myReviews.map(r => {
      const p = PRODUCTS.find(x => x.id===r.product_id) || {icon:'📦', name: t('rv.unknown')};
      const rvLocMap = {ja:'ja-JP', en:'en-US', zh:'zh-CN'};
      const dt = new Date(r.created_at).toLocaleDateString(rvLocMap[currentLang]||'ja-JP', {year:'numeric',month:'long',day:'numeric'});
      return `<div class="review-card">
        <div class="review-card-head">
          <div class="review-product-icon">${p.icon}</div>
          <div><div class="review-product-name">${p.name}</div><div class="review-date">${dt}</div></div>
        </div>
        <div class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
        ${r.title ? `<div class="review-title">${r.title}</div>` : ''}
        <div class="review-body">${r.body}</div>
        <button class="review-del-btn" onclick="deleteReview(${r.id})">${t('rv.delete')}</button>
      </div>`;
    }).join('') : `<div class="empty"><div class="empty-icon">⭐</div><p>${t('rv.empty')}</p></div>`}`;
  updateStars();
}

function setRating(n) { reviewRating = n; updateStars(); }
function updateStars() { [1,2,3,4,5].forEach(n => { const el = document.getElementById('star'+n); if(el) el.classList.toggle('on', n<=reviewRating); }); }

async function submitReview() {
  const pid = parseInt(document.getElementById('rv_product').value);
  const body = document.getElementById('rv_body').value.trim();
  if (!pid) { showToast(t('rv.noProduct')); return; }
  if (!reviewRating) { showToast(t('rv.noRating')); return; }
  if (!body) { showToast(t('rv.noBody')); return; }
  try {
    const r = await api('POST', '/api/reviews', {product_id: pid, rating: reviewRating, title: document.getElementById('rv_title').value||null, body});
    const exist = myReviews.findIndex(x => x.product_id===pid);
    if (exist >= 0) myReviews[exist] = r; else myReviews.unshift(r);
    reviewRating = 0;
    renderReviews(document.getElementById('mpContent'));
    showToast(t('rv.submitted'));
  } catch(e) { showToast(t('rv.submitFail') + e.message); }
}

async function deleteReview(id) {
  try {
    await api('DELETE', `/api/reviews/${id}`);
    myReviews = myReviews.filter(x => x.id!==id);
    renderReviews(document.getElementById('mpContent'));
    showToast(t('rv.deleted'));
  } catch{}
}

    <div id="addrFormWrap"></div>
    <div class="sec-title">${t('addr.listTitle')}</div>

        <div><div class="pf-label">${t('addr.label')}</div><input class="addr-input" id="af_label" value="${t('addr.labelDef')}" placeholder="${t('addr.labelPh')}"></div>
        <div><div class="pf-label">${t('addr.name')}</div><input class="addr-input" id="af_name" placeholder="${t('addr.namePh')}"></div>
        <div><div class="pf-label">${t('addr.kana')}</div><input class="addr-input" id="af_kana" placeholder="${t('addr.kanaPh')}"></div>
        <div><div class="pf-label">${t('addr.phone')}</div><input class="addr-input" id="af_phone" placeholder="${t('addr.phonePh')}"></div>
        <div><div class="pf-label">${t('addr.zip')}</div><input class="addr-input" id="af_zip" placeholder="${t('addr.zipPh')}"></div>
        <div><div class="pf-label">${t('addr.pref')}</div><input class="addr-input" id="af_pref" placeholder="${t('addr.prefPh')}"></div>
        <div><div class="pf-label">${t('addr.city')}</div><input class="addr-input" id="af_city" placeholder="${t('addr.cityPh')}"></div>
        <div><div class="pf-label">${t('addr.addr')}</div><input class="addr-input" id="af_addr" placeholder="${t('addr.addrPh')}"></div>
      </div>

      <div style="display:flex;gap:.7rem">

        <button class="addr-btn" onclick="document.getElementById('addrFormWrap').innerHTML=''">${t('addr.cancel')}</button>
      </div>
    </div>`;
}

async function saveAddr() {
  const name = document.getElementById('af_name')?.value.trim();
  const zip  = document.getElementById('af_zip')?.value.trim();
  const pref = document.getElementById('af_pref')?.value.trim();
  const city = document.getElementById('af_city')?.value.trim();
  const addr = document.getElementById('af_addr')?.value.trim();
  if (!name||!zip||!pref||!city||!addr) { showToast(t('addr.required')); return; }
  try {
    const r = await api('POST', '/api/addresses', {
      label: document.getElementById('af_label').value || t('addr.labelDef'),
      name, kana: document.getElementById('af_kana').value,
      phone: document.getElementById('af_phone').value,
      zip, pref, city, addr,
      is_default: document.getElementById('af_default').checked
    });
    if (r.is_default) addresses = addresses.map(a => ({...a, is_default: false}));
    addresses.push(r);
    renderAddresses(document.getElementById('mpContent'));
    showToast(t('addr.added'));
  } catch(e) { showToast(t('addr.saveFail') + e.message); }
}

async function setDefault(id) {
  try {
    await api('PATCH', `/api/addresses/${id}/set-default`);
    addresses = addresses.map(a => ({...a, is_default: a.id===id}));
    renderAddresses(document.getElementById('mpContent'));
    showToast(t('addr.defSet'));
  } catch{}
}

async function deleteAddr(id) {
  try {
    await api('DELETE', `/api/addresses/${id}`);
    addresses = addresses.filter(a => a.id!==id);
    renderAddresses(document.getElementById('mpContent'));
    showToast(t('addr.deleted'));
  } catch{}
}

// ── AI ──
function renderAI(body) {
  if (!currentUser) { switchTab('auth'); return; }
  const chips = t('ai.chips');
  body.innerHTML = `
    <p class="section-eyebrow" style="margin-bottom:.5rem">${t('ai.title')}</p>
    <p class="ai-sub">${t('ai.sub')}</p>
    <div class="ai-msgs" id="aiMsgs">
      <div class="ai-msg assistant">${t('ai.greeting', currentUser.name)}</div>
    </div>
    <div class="ai-input-row">
      <input class="ai-input" id="aiInput" placeholder="${t('ai.ph')}" onkeydown="if(event.key==='Enter')sendAI()">
      <button class="ai-send" id="aiSend" onclick="sendAI()">${t('ai.send')}</button>
    </div>
    <div class="ai-chips">
      ${chips.map(q => `<button class="ai-chip" onclick="document.getElementById('aiInput').value='${q}';sendAI()">${q}</button>`).join('')}
    </div>`;
  if (aiMessages.length) {
    const list = document.getElementById('aiMsgs');
    list.innerHTML = '';
    aiMessages.forEach(m => { const d = document.createElement('div'); d.className='ai-msg '+m.role; d.textContent=m.content; list.appendChild(d); });
    list.scrollTop = list.scrollHeight;
  }
}

async function sendAI() {
  const inp = document.getElementById('aiInput');
  const btn = document.getElementById('aiSend');
  const list = document.getElementById('aiMsgs');
  if (!inp||!list) return;
  const msg = inp.value.trim(); if (!msg) return;
  inp.value = ''; btn.disabled = true;
  const ud = document.createElement('div'); ud.className='ai-msg user'; ud.textContent=msg; list.appendChild(ud);
  const ld = document.createElement('div'); ld.className='ai-msg assistant loading'; ld.textContent=t('ai.thinking'); list.appendChild(ld);
  list.scrollTop = list.scrollHeight;

  const histStr = orderHistory.length
    ? t('ai.sysHist') + orderHistory.map(o => { const items=Array.isArray(o.items)?o.items:JSON.parse(o.items||'[]'); return items.map(i=>i.name).join('、'); }).join(' / ')
    : t('ai.sysNoHist');
  const sys = t('ai.sysPrompt')
    .replace('%name', currentUser.name)
    .replace('%hist', histStr)
    .replace('%products', PRODUCTS.map(p=>`${p.name}（${p.brand}、¥${p.price.toLocaleString()}）`).join('、'));

  aiMessages.push({role:'user', content: msg});
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:1000, system:sys, messages:aiMessages})
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || t('ai.retry');
    ld.classList.remove('loading'); ld.textContent = reply;
    aiMessages.push({role:'assistant', content: reply});
  } catch { ld.textContent = t('ai.error'); }
  btn.disabled = false; list.scrollTop = list.scrollHeight;
}

// ── INIT ──
async function init() {
  await restoreSession();
  updateCartBadge();
  // Apply saved language first
  document.getElementById('langJP').classList.toggle('active', currentLang==='ja');
  document.getElementById('langEN').classList.toggle('active', currentLang==='en');
  document.getElementById('langZH').classList.toggle('active', currentLang==='zh');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = I18N[currentLang][key];
    if (val !== undefined) el.innerHTML = val;
  });
  if (currentUser) {
    await loadAllData();
    showLoggedInTabs();
    switchTab('profile');
  } else {
    renderAuth(document.getElementById('mpContent'));
  }
}
init();
